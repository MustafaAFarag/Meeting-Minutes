[package]
name = "meeting-notes-app"
version = "0.1.0"
description = "Meeting Notes desktop widget"
edition = "2021"

[lib]
name = "meeting_notes_app"
path = "src/lib.rs"

[[bin]]
name = "meeting-notes-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
chrono = "0.4"
dirs = "6"
meeting-notes-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
