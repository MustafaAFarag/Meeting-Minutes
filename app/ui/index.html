<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <symbol id="starburst" viewBox="0 0 24 24">
      <g stroke="#D97757" stroke-width="2.6" stroke-linecap="round">
        <line x1="12" y1="2.5" x2="12" y2="7"/>
        <line x1="12" y1="17" x2="12" y2="21.5"/>
        <line x1="2.5" y1="12" x2="7" y2="12"/>
        <line x1="17" y1="12" x2="21.5" y2="12"/>
        <line x1="5.3" y1="5.3" x2="8.5" y2="8.5"/>
        <line x1="15.5" y1="15.5" x2="18.7" y2="18.7"/>
        <line x1="18.7" y1="5.3" x2="15.5" y2="8.5"/>
        <line x1="8.5" y1="15.5" x2="5.3" y2="18.7"/>
      </g>
    </symbol>
  </svg>

  <!-- #app is the tab. data-view is what the app is doing; data-fold is folded ("closed") or
       unfolded ("open"); data-edge is the screen edge it hangs from. -->
  <main id="app" data-view="idle" data-fold="closed" data-edge="right" data-pinned="false">

    <!-- Folded: one status mark. -->
    <div class="mini" aria-hidden="true">
      <span class="mark dot cyan" data-view="idle"></span>
      <span class="mark dot rec" data-view="recording"></span>
      <svg class="mark spinner" data-view="working" viewBox="0 0 24 24" width="10" height="10"><use href="#starburst"/></svg>
      <span class="mark dot ok" data-view="done"></span>
      <span class="mark bang" data-view="error">!</span>
    </div>

    <!-- Unfolded: status, then the buttons. -->
    <div class="full">
      <div id="status" class="status" title="Ready">
        <span class="item dot cyan" data-view="idle"></span>
        <div class="item rec" data-view="recording">
          <span id="timer" class="timer">00:00</span>
          <span class="levels">
            <span class="bar" title="You"><i id="bar-me"></i></span>
            <span class="bar" title="Them"><i id="bar-them"></i></span>
          </span>
        </div>
        <svg class="item spinner" data-view="working" viewBox="0 0 24 24" width="20" height="20"><use href="#starburst"/></svg>
        <span class="item check" data-view="done">✓</span>
        <span class="item bang" data-view="error">!</span>
      </div>

      <button id="start" class="icon-btn round" type="button" title="Start recording (Ctrl+Alt+R)" aria-label="Start recording">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      </button>
      <button id="stop" class="icon-btn round" type="button" title="Stop recording (Ctrl+Alt+R)" aria-label="Stop recording" disabled>
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button id="retry" class="icon-btn small" type="button" title="Try again" aria-label="Try again" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.2-5.1M19 4.5v4.4h-4.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="open-meetings" class="icon-btn small" type="button" title="Open My Meetings" aria-label="Open My Meetings">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <!-- Notes queue: a spinner (and how many wait) while notes are written, "!" if they failed.
             It sits on the corner of this button, so the record controls never move. -->
        <span id="queue-badge" class="badge" data-state="idle" aria-hidden="true">
          <svg class="spinner" viewBox="0 0 24 24" width="10" height="10"><use href="#starburst"/></svg>
          <span id="queue-count" class="count"></span>
          <span class="bang">!</span>
        </span>
      </button>
      <div id="update-box" class="update-box" hidden>
        <button id="update" class="update" type="button">
          <span id="update-kicker" class="kicker">Update</span>
          <span id="update-detail" class="detail"></span>
        </button>
        <button id="update-help" class="update help" type="button" hidden>Get help</button>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
