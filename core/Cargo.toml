[package]
name = "meeting-notes-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mn_core"
path = "src/lib.rs"

[[bin]]
name = "mn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"
