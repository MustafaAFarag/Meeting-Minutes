name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            tauri_args: --target universal-apple-darwin
            bundle_glob: app/src-tauri/target/**/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            tauri_args: ""
            bundle_glob: app/src-tauri/target/**/release/bundle/nsis/*.exe
          - name: linux
            os: ubuntu-22.04
            tauri_args: ""
            bundle_glob: app/src-tauri/target/**/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            core -> target

      # cargo install takes several minutes, so keep the binary between runs.
      # Bump the "v1" in the key to pick up a newer tauri-cli 2.x.
      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri looks for binaries/mn-audiotap-<target-triple>. A universal build
      # compiles each arch separately and then merges, so all three names are
      # needed. The helper is already universal, so the same file serves all.
      - name: Build mn-audiotap (macOS)
        if: runner.os == 'macOS'
        run: |
          out="$(bash mac/audiotap/build.sh | tail -n 1)"
          test -f "$out" || { echo "build.sh did not print a file path, got: $out"; exit 1; }
          mkdir -p app/src-tauri/binaries
          for triple in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin; do
            cp "$out" "app/src-tauri/binaries/mn-audiotap-$triple"
          done
          chmod +x app/src-tauri/binaries/mn-audiotap-*
          file app/src-tauri/binaries/mn-audiotap-universal-apple-darwin

      # Makes icon.icns (and the rest of the set) from the 1024x1024 source.
      - name: Generate icons
        working-directory: app/src-tauri
        run: cargo tauri icon app-icon.png

      # core's integration tests use Unix-only APIs (std::os::unix), so they
      # do not compile on Windows. The core code itself is still built and
      # tested through the app below.
      - name: Test core
        if: runner.os != 'Windows'
        working-directory: core
        run: cargo test

      - name: Test app
        working-directory: app/src-tauri
        run: cargo test

      - name: Build installer
        working-directory: app/src-tauri
        run: cargo tauri build ${{ matrix.tauri_args }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: meeting-notes-${{ matrix.name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: meeting-notes-*

      - name: List files
        run: find dist -type f

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
          fail_on_unmatched_files: true
