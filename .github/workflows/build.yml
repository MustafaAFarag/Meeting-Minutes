name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            tauri_args: --target universal-apple-darwin
            bundle_path: '*/release/bundle/dmg/*.dmg'
          - name: windows
            os: windows-latest
            tauri_args: ""
            bundle_path: '*/release/bundle/nsis/*.exe'
          - name: linux
            os: ubuntu-22.04
            tauri_args: ""
            bundle_path: '*/release/bundle/appimage/*.AppImage'
    runs-on: ${{ matrix.os }}
    # A full build takes 20-35 min. Without a limit a hung step runs for GitHub's 6 h default.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # azure.archive.ubuntu.com can be very slow (v0.1.1 ran 4 h here; v0.1.2 got 130 packages
      # in 10 min). The packages are cached, so only a cache miss downloads them.
      # Bump `version` to force a fresh download.
      - name: Configure apt retries (Linux)
        if: runner.os == 'Linux'
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        timeout-minutes: 20
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        env:
          DEBIAN_FRONTEND: noninteractive
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev libxdo-dev patchelf
          version: tauri-deps-1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            app/src-tauri -> target
            core -> target

      # cargo install takes several minutes, so keep the binary between runs.
      # Bump the "v1" in the key to pick up a newer tauri-cli 2.x.
      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri looks for binaries/mn-audiotap-<target-triple>. A universal build
      # compiles each arch separately and then merges, so all three names are
      # needed. The helper is already universal, so the same file serves all.
      - name: Build mn-audiotap (macOS)
        if: runner.os == 'macOS'
        run: |
          out="$(bash mac/audiotap/build.sh | tail -n 1)"
          test -f "$out" || { echo "build.sh did not print a file path, got: $out"; exit 1; }
          mkdir -p app/src-tauri/binaries
          for triple in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin; do
            cp "$out" "app/src-tauri/binaries/mn-audiotap-$triple"
          done
          chmod +x app/src-tauri/binaries/mn-audiotap-*
          file app/src-tauri/binaries/mn-audiotap-universal-apple-darwin

      - name: Prepare whisper.cpp source (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch b5130 https://github.com/ggml-org/whisper.cpp whisper.cpp
          mkdir -p whisper-cli-cache

      # The tag and runner architecture identify this universal static binary.
      - name: Cache whisper-cli (macOS)
        id: whisper-cli-cache
        if: runner.os == 'macOS'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: whisper-cli-cache/whisper-cli
          key: whisper-b5130-${{ runner.arch }}

      - name: Build whisper-cli (macOS)
        if: runner.os == 'macOS' && steps.whisper-cli-cache.outputs.cache-hit != 'true'
        run: |
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build --config Release -j --target whisper-cli
          cp build/bin/whisper-cli ../whisper-cli-cache/whisper-cli

      - name: Verify whisper-cli (macOS)
        if: runner.os == 'macOS'
        working-directory: whisper.cpp
        run: |
          test -x ../whisper-cli-cache/whisper-cli
          archs="$(lipo -archs ../whisper-cli-cache/whisper-cli)"
          echo "Architectures: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "Missing arm64 slice"; exit 1 ;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "Missing x86_64 slice"; exit 1 ;; esac

          # One arch at a time: on a universal binary `otool -L` prints a header line (the
          # binary's own path) per arch, and only the first one would be skipped.
          for arch in arm64 x86_64; do
            dependencies="$(otool -L -arch "$arch" ../whisper-cli-cache/whisper-cli | tail -n +2 | awk '{print $1}')"
            echo "[$arch]"; printf '%s\n' "$dependencies"
            unexpected="$(printf '%s\n' "$dependencies" | grep -Ev '^(/usr/lib/|/System/)' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::whisper-cli ($arch) links non-system libraries: $unexpected"
              exit 1
            fi
          done

          curl -fL --retry 3 --retry-delay 3 \
            -o models/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          out=/tmp/whisper-cli-macos-transcript.txt
          # GitHub's Mac VMs may have no usable Metal GPU. Then check the CPU path (-ng)
          # instead of failing the release; real Macs have the GPU.
          if ../whisper-cli-cache/whisper-cli -m models/ggml-tiny.en.bin -f samples/jfk.wav -nt >"$out" 2>&1 &&
            grep -qi "ask not" "$out"; then
            echo "Transcription OK (default backend)"
          else
            tail -n 30 "$out"
            echo "::warning::whisper-cli failed with the default (Metal) backend on the runner; retrying on CPU"
            ../whisper-cli-cache/whisper-cli -ng -m models/ggml-tiny.en.bin -f samples/jfk.wav -nt >"$out" 2>&1 || { tail -n 30 "$out"; exit 1; }
            grep -qi "ask not" "$out" || { tail -n 30 "$out"; echo "::error::transcript has no 'ask not'"; exit 1; }
            echo "Transcription OK (CPU)"
          fi
          grep -i "ask not" "$out"

      # Makes icon.icns (and the rest of the set) from the 1024x1024 source.
      - name: Generate icons
        working-directory: app/src-tauri
        run: cargo tauri icon app-icon.png

      # Integration tests that need Unix (/proc, sh fakes) are cfg(unix) and skip themselves.
      - name: Test core
        working-directory: core
        run: cargo test

      - name: Test app
        working-directory: app/src-tauri
        run: cargo test

      - name: Build installer
        working-directory: app/src-tauri
        run: cargo tauri build ${{ matrix.tauri_args }}

      # The setup scripts download from releases/latest/download/<name>, so every
      # file gets a fixed name. `mn` is the command-line tool the setup uses to
      # create the My Meetings page and to check the install.
      - name: Collect files with fixed names
        run: |
          # find, not a ** glob: globstar needs bash 4+, and the macOS runner's bash may be 3.2.
          # The bundle is under target/release/... (Windows, Linux) or target/<triple>/release/... (macOS).
          bundles=()
          while IFS= read -r f; do bundles+=("$f"); done < <(/usr/bin/find app/src-tauri/target -maxdepth 6 -path '${{ matrix.bundle_path }}' -type f)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 file matching ${{ matrix.bundle_path }}, found ${#bundles[@]}: ${bundles[*]}"
            /usr/bin/find app/src-tauri/target -maxdepth 6 -path '*/release/bundle/*' -type f | head -n 20
            exit 1
          fi
          mkdir -p out
          case "${{ matrix.name }}" in
            macos)
              cp "${bundles[0]}" out/MeetingNotes-macos.dmg
              (cd core && cargo build --release --target aarch64-apple-darwin && cargo build --release --target x86_64-apple-darwin)
              lipo -create -output out/mn-macos core/target/aarch64-apple-darwin/release/mn core/target/x86_64-apple-darwin/release/mn
              cp whisper-cli-cache/whisper-cli out/whisper-cli-macos
              ;;
            windows)
              cp "${bundles[0]}" out/MeetingNotes-windows-setup.exe
              (cd core && cargo build --release)
              cp core/target/release/mn.exe out/mn-windows.exe
              ;;
            linux)
              cp "${bundles[0]}" out/MeetingNotes-linux.AppImage
              (cd core && cargo build --release)
              cp core/target/release/mn out/mn-linux
              ;;
          esac
          ls -la out

      - name: Upload files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meeting-notes-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: meeting-notes-*

      - name: List files
        run: find dist -type f

      # Published (not draft) so releases/latest/download/... works for the setup scripts.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          make_latest: true
          files: dist/**/*
          fail_on_unmatched_files: true
