<style>
/* ctcHealth brand. Layout: banner strip, header (logo, title, counters, dots), then master-detail. */
:root {  /* dark first: Deep canvas, on-Deep text. Accent only on the active tab, the counter that matters and the Today dot. */
  --bg: #003240; --surface: #0e4554; --inset: #003240;
  --fg: #e3ecec; --body: #e3ecec; --muted: #c6d2d3;
  --accent: #6ce5e8; --accent-fg: #003240;
  --ctl: #c6d2d3;            /* checkboxes, links: neutral */
  --sel: #1b5466;            /* selected row, hover: a surface step */
  --chip-bg: #1b5466; --chip-fg: #e3ecec; --dot: #99adb3;
  --line: #1b5466; --line-in: #1b5466; --negative: #ff9b85;
  --btn-fill: #e3ecec; --btn-fg: #003240; --btn-line: #e3ecec;
  --me-bg: #1b5466;
  --dot-n: #5e8c96; --dot-a: #6ce5e8; --dot-share: .15;
  --logo-light: none; --logo-dark: block;
  --font-display: "Poppins", Arial, sans-serif;
  --font-body: "DM Sans", Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {  /* Mist page, white cards, Deep text */
  --bg: #eef5f4; --surface: #ffffff; --inset: #eef5f4;
  --fg: #003240; --body: #335b66; --muted: #4a6c75;
  --accent: #32737b; --accent-fg: #ffffff;
  --ctl: #003240; --sel: #e3ecec;
  --chip-bg: #eef5f4; --chip-fg: #003240; --dot: #99adb3;
  --line: #dce6e5; --line-in: #dce6e5; --negative: #b4351c;
  --btn-fill: #003240; --btn-fg: #ffffff; --btn-line: #003240;
  --me-bg: #dce6e5;
  --dot-n: #a3b1b6; --dot-a: #003240; --dot-share: .15;
  --logo-light: block; --logo-dark: none;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.4 var(--font-body); }
.banner { display: flex; height: 6px; }
.banner i { flex: 1; }
.wrap { padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1000px) { .wrap { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 500; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-right: auto; }
.logo { height: 34px; width: auto; }
.logo.l { display: var(--logo-light); } .logo.d { display: var(--logo-dark); }
.title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-left: 16px; border-left: 2px solid var(--line); }
.sub { color: var(--muted); font-size: 14px; }
.counters { display: flex; gap: 8px; flex-wrap: wrap; }
.counter { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border: 0; border-radius: 8px; padding: 6px 12px; min-width: 0; }
.counter:hover { background: var(--sel); }
.counter b { font: 500 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.counter span { color: var(--muted); font-size: 14px; }
.counter.hot b { color: var(--accent); }
.dots { display: none; width: 160px; height: 56px; position: relative; overflow: hidden; flex: none; }
.dots canvas { position: absolute; left: 0; top: 0; }
@media (min-width: 1300px) { .dots { display: block; } }
.tbtn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; background: var(--surface); border: 0; border-radius: 8px; color: var(--fg); }
.tbtn:hover { background: var(--sel); }
.tbtn svg { width: 18px; height: 18px; }
@media (max-width: 560px) { .counters { display: grid; grid-template-columns: repeat(2, 1fr); width: 100%; } .title { border-left: 0; padding-left: 0; } }

.layout { margin-top: 14px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.detail { display: none; }
@media (min-width: 1000px) {
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
  .side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 2px; }
  .detail { display: block; min-width: 0; }
  #search { flex-basis: 100%; }
  .tr { max-height: 60vh; }
}
.today { background: var(--surface); border-radius: 16px; padding: 12px 16px; }
.today h2 { margin-bottom: 2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.today h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.today .none { color: var(--body); margin: 0; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.tab { border: 0; background: var(--surface); border-radius: 999px; padding: 5px 13px; font-weight: 500; }
.tab:hover { background: var(--sel); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.tab small { opacity: .8; margin-left: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
#search { flex: 1 1 200px; min-width: 0; max-width: 100%; border: 0; background: var(--surface); color: var(--fg); border-radius: 8px; padding: 9px 14px; font: inherit; }
#search::placeholder { color: var(--muted); }

#view { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border-radius: 16px; overflow: hidden; }
.card-head { width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.card-head .main { flex: 1; min-width: 0; }
.card-head h3 { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.chev { color: var(--muted); transition: transform .15s; margin-top: 4px; }
.open .chev { transform: rotate(90deg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip-bg); color: var(--chip-fg); border-radius: 999px; padding: 2px 11px 2px 9px; font-size: 13.5px; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
.chip.client { font-weight: 500; }
.chip.link { text-decoration: none; }
.chip.link:hover { text-decoration: underline; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line-in); }
.sec h4 { margin: 0 0 6px; font: 500 13px/1.2 var(--font-body); color: var(--muted); }
.sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--body); }
.sec p { margin: 0; color: var(--body); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; color: var(--body); }
th, td { text-align: left; padding: 6px 10px 6px 0; vertical-align: top; border-bottom: 1px solid var(--line-in); }
th { font-weight: 500; color: var(--muted); font-size: 13px; }

.items { list-style: none; padding: 0 !important; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; min-width: 0; }
.item input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--ctl); cursor: pointer; }
.item .t { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
.item.done .t > span:first-child { text-decoration: line-through; color: var(--muted); }
.item .sm { display: block; font-size: 13px; color: var(--muted); }
.item .sm a, .item .sm button { color: var(--muted); }
.due { font-size: 13px; color: var(--muted); white-space: nowrap; }
.due.over { color: var(--negative); font-weight: 500; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
a { color: var(--ctl); text-underline-offset: 2px; }
.group h3 { font-size: 14px; color: var(--muted); font-family: var(--font-body); font-weight: 500; margin: 6px 2px; }
.group h3.over { color: var(--negative); }
.panel { background: var(--surface); border-radius: 16px; padding: 8px 16px; }

.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 2px solid var(--btn-line); background: transparent; color: var(--fg); border-radius: 8px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
.btn.fill { background: var(--btn-fill); border-color: var(--btn-fill); color: var(--btn-fg); }
.btn:hover { text-decoration: underline; }
.tr { background: var(--inset); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
.line { display: flex; gap: 8px; align-items: flex-start; }
.line.me { flex-direction: row-reverse; }
.bubble { max-width: 85%; padding: 6px 10px; border-radius: 10px; background: var(--surface); color: var(--fg); overflow-wrap: anywhere; }
.bubble small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.me .bubble { background: var(--me-bg); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty b { display: block; color: var(--fg); font: 600 18px var(--font-display); margin-bottom: 4px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--btn-fill); color: var(--btn-fg); padding: 8px 16px; border-radius: 8px; font-size: 14px; max-width: 90vw; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

.row { width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: 16px; padding: 8px 12px; display: block; }
.row:hover, .row.sel { background: var(--sel); }
.row.sel .chip, .row:hover .chip { background: var(--surface); }
.row { cursor: pointer; }
.row .rt { display: block; font-weight: 700; overflow-wrap: anywhere; }
.row .tline { gap: 4px; }
.row .pen { padding: 2px; }
.row .pen svg { width: 13px; height: 13px; }
.row .rename { font: 700 15px/1.3 var(--font-body); padding: 1px 6px; }
.row .chips { margin-top: 4px; }
.dhead { margin-bottom: 12px; }
.dhead .chip { background: var(--surface); }
.dhead h2 { font-size: 24px; font-weight: 500; }
.tline { display: flex; align-items: center; gap: 8px; }
.pen { background: none; border: 0; padding: 4px; border-radius: 6px; color: var(--muted); opacity: .7; line-height: 0; flex: none; }
.pen:hover, .pen:focus-visible { opacity: 1; color: var(--fg); }
.pen svg { width: 15px; height: 15px; }
.rename { font: 500 22px/1.25 var(--font-display); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; width: min(100%, 640px); }
.body .rename { font-size: 17px; }
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dgrid > * { min-width: 0; }
.dgrid .full { grid-column: 1 / -1; }
.col { display: flex; flex-direction: column; gap: 14px; }
.dc { background: var(--surface); border-radius: 16px; padding: 14px 18px; }
.dc .sec ul { gap: 3px; }
.dc table { font-size: 13.5px; }
.dc th, .dc td { padding: 4px 12px 4px 0; }
.row3 { display: flex; gap: 8px 28px; flex-wrap: wrap; align-items: flex-start; }
</style>

<script>
(function () {
  var db = null, downloads = null, canWrite = true;
  var meetings = new Map();          // id -> doc data (local copy)
  var loaded = false, dbMissing = false;
  var tab = "meetings", query = "", selected = null;
  var mq = window.matchMedia("(min-width: 1000px)");
  if (mq.addEventListener) mq.addEventListener("change", function () { render(); });
  var expanded = new Set(), trShown = new Set(), trText = new Map(), trBusy = new Set();
  var writeChain = new Map();
  var ticks = new Map(), ticksLocal = false;   // meeting id -> {key: true}
  function doneOf(m) { return ticks.get(m.id) || {}; }
  var titles = new Map();                       // meeting id -> the user's own title
  function titleOf(m) { return titles.get(m.id) || m.title || ""; }
  var editing = null, editDraft = "";           // meeting id being renamed, and the text typed so far

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  /* ---------- dates ---------- */
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseDay(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function dayDiff(d) { return Math.round((startOfDay(d) - startOfDay(new Date())) / 864e5); }
  function dayLabel(d) {
    var n = dayDiff(d);
    if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
    return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "");
  }
  function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function dueHtml(due) {
    var d = parseDay(due); if (!d) return "";
    var over = dayDiff(d) < 0;
    return '<span class="due' + (over ? " over" : "") + '">' + (over ? "Overdue, " : "Due ") + esc(dayLabel(d)) + "</span>";
  }
  function bucket(due) {
    var d = parseDay(due); if (!d) return "none";
    var n = dayDiff(d);
    return n < 0 ? "over" : n === 0 ? "today" : n <= 7 ? "week" : "later";
  }

  /* ---------- data helpers ---------- */
  function sortedMeetings() {
    return Array.from(meetings.values()).sort(function (a, b) { return String(b.started_at || b.id).localeCompare(String(a.started_at || a.id)); });
  }
  function allItems() {
    var out = [];
    meetings.forEach(function (m) {
      var done = doneOf(m);
      (m.my_todos || []).forEach(function (t, i) { var k = "todo-" + i; out.push({ kind: "todo", key: k, m: m, text: t.text, due: t.due, done: !!done[k] }); });
      (m.waiting_on || []).forEach(function (t, i) { var k = "wait-" + i; out.push({ kind: "wait", key: k, m: m, text: t.text, due: t.due, who: t.who, done: !!done[k] }); });
    });
    return out;
  }
  function matches(m) {
    if (!query) return true;
    var hay = [titleOf(m), m.client, m.project, (m.summary || []).join(" "), (m.decisions || []).join(" "),
      (m.my_todos || []).map(function (t) { return t.text; }).join(" "),
      (m.waiting_on || []).map(function (t) { return t.text + " " + t.who; }).join(" "),
      (m.deliverables || []).map(function (t) { return t.what; }).join(" ")].join(" ").toLowerCase();
    return query.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
  }

  /* ---------- pieces ---------- */
  function itemHtml(it, showWho) {
    var id = esc(it.m.id);
    return '<li class="item' + (it.done ? " done" : "") + '"><input type="checkbox" data-tick="' + id + '|' + it.key + '"' + (it.done ? " checked" : "") +
      (canWrite ? "" : " disabled") + ' aria-label="Tick off">' +
      '<span class="t"><span>' + (showWho && it.who ? "<b>" + esc(it.who) + ":</b> " : "") + esc(it.text) + '</span> ' + (it.done ? "" : dueHtml(it.due)) +
      '<span class="sm"><button class="linkbtn" data-goto="' + id + '">' + esc(titleOf(it.m)) + "</button></span></span></li>";
  }
  function inCardItem(m, it, who) {
    return '<li class="item' + (it.done ? " done" : "") + '"><input type="checkbox" data-tick="' + esc(m.id) + '|' + it.key + '"' + (it.done ? " checked" : "") +
      (canWrite ? "" : " disabled") + ' aria-label="Tick off"><span class="t"><span>' + (who ? "<b>" + esc(who) + ":</b> " : "") + esc(it.text) + "</span> " + (it.done ? "" : dueHtml(it.due)) + "</span></li>";
  }
  function transcriptHtml(id) {
    if (trBusy.has(id)) return '<div class="tr">Loading transcript...</div>';
    var text = trText.get(id);
    if (text === null) return '<div class="tr">The transcript is not available for this meeting.</div>';
    if (text === undefined) return "";
    var rows = text.split(/\r?\n/).map(function (ln) {
      var m = /^\[(\d\d:\d\d:\d\d)\]\s*\*\*(Me|Them):\*\*\s*(.*)$/.exec(ln);
      if (m) return '<div class="line ' + (m[2] === "Me" ? "me" : "them") + '"><div class="bubble"><small>' + (m[2] === "Me" ? "Me" : "Them") + " &middot; " + m[1] + "</small>" + esc(m[3]) + "</div></div>";
      if (!ln.trim() || /^#|^<!--/.test(ln.trim())) return "";
      return '<div class="meta">' + esc(ln) + "</div>";
    }).join("");
    return '<div class="tr">' + (rows || "This transcript is empty.") + "</div>";
  }

  function ul(a) { return "<ul>" + a.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
  function sec(t, inner) { return inner ? '<div class="sec"><h4>' + t + "</h4>" + inner + "</div>" : ""; }
  function headInfo(m) {
    var s = m.started_at ? new Date(m.started_at) : null, e = m.ended_at ? new Date(m.ended_at) : null;
    var when = s && !isNaN(s) ? dayLabel(s) + ", " + hhmm(s) + (e && !isNaN(e) ? "\u2013" + hhmm(e) : "") : esc(m.id);
    return { when: when + (m.duration_min ? " \u00b7 " + esc(m.duration_min) + " min" : ""),
      chips: (m.client ? '<span class="chip client">' + esc(m.client) + "</span>" : "") + (m.project ? '<span class="chip">' + esc(m.project) + "</span>" : "") +
        (m.generated_by === "codex" ? '<span class="chip warn">Name guessed \u2014 calendar not checked</span>' : "") };
  }
  function parts(m) {
    var done = doneOf(m), p = {};
    p.summary = sec("Summary", (m.summary || []).length ? ul(m.summary) : "");
    p.decisions = sec("Decisions", (m.decisions || []).length ? ul(m.decisions) : "");
    p.deliv = sec("Deliverables", (m.deliverables || []).length ? '<div class="table-wrap"><table><thead><tr><th>What</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>' +
      m.deliverables.map(function (d) { var dd = parseDay(d.due); return "<tr><td>" + esc(d.what) + "</td><td>" + esc(d.owner || "\u2013") + "</td><td>" + (dd ? esc(dayLabel(dd)) : "\u2013") + "</td><td>" + esc(d.status) + "</td></tr>"; }).join("") + "</tbody></table></div>" : "");
    p.todos = sec("My to-dos", (m.my_todos || []).length ? '<ul class="items">' +
      m.my_todos.map(function (t, i) { return inCardItem(m, { key: "todo-" + i, text: t.text, due: t.due, done: !!done["todo-" + i] }); }).join("") + "</ul>" : "");
    p.waits = sec("Waiting on others", (m.waiting_on || []).length ? '<ul class="items">' +
      m.waiting_on.map(function (t, i) { return inCardItem(m, { key: "wait-" + i, text: t.text, due: t.due, done: !!done["wait-" + i] }, t.who); }).join("") + "</ul>" : "");
    p.links = sec("Related links", (m.related_links || []).length ? '<div class="chips">' +
      m.related_links.map(function (l) { return '<a class="chip link" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.title || l.url) + "</a>"; }).join("") + "</div>" : "");
    p.people = sec("Attendees", (m.attendees || []).length ? '<div class="chips">' + m.attendees.map(function (a) { return '<span class="chip">' + esc(a) + "</span>"; }).join("") + "</div>" : "");
    p.btns = '<div class="sec"><div class="btns"><button class="btn" data-tr="' + esc(m.id) + '">' + (trShown.has(m.id) ? "Hide transcript" : "Show transcript") + "</button>" +
      (downloads ? '<button class="btn fill" data-dl="' + esc(m.id) + '">Download transcript</button>' : "") + "</div>" +
      (trShown.has(m.id) ? '<div style="margin-top:8px">' + transcriptHtml(m.id) + "</div>" : "") + "</div>";
    return p;
  }

  /* narrow screens: a card that expands in place */
  function cardHtml(m) {
    var open = expanded.has(m.id), h = headInfo(m);
    var out = '<article class="card' + (open ? " open" : "") + '" id="m-' + esc(m.id) + '"><button class="card-head" data-toggle="' + esc(m.id) + '" aria-expanded="' + open + '">' +
      '<div class="main"><h3>' + esc(titleOf(m)) + '</h3><div class="meta">' + h.when + "</div>" +
      (h.chips ? '<div class="chips">' + h.chips + "</div>" : "") + '</div><span class="chev" aria-hidden="true">\u25B6</span></button>';
    if (!open) return out + "</article>";
    var p = parts(m);
    return out + '<div class="body">' + (canWrite ? titleHtml(m, "") : "") + p.summary + p.decisions + p.deliv + p.todos + p.waits + p.links + p.people + p.btns + "</div></article>";
  }

  /* wide screens: compact row on the left, full detail on the right */
  function rowHtml(m, sel) {
    var h = headInfo(m);
    // A div, not a button, so the rename pen (a button) can sit next to the name inside it.
    return '<div class="row' + (sel ? " sel" : "") + '" role="button" tabindex="0" data-select="' + esc(m.id) + '">' + titleHtml(m, "span") +
      '<span class="meta">' + h.when + "</span>" + (h.chips ? '<span class="chips">' + h.chips + "</span>" : "") + "</div>";
  }
  var PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  /* The title with a pen to rename it. tag "" = only the pen (narrow cards already show the title). */
  function titleHtml(m, tag) {
    if (editing === m.id) return '<div class="tline"><input class="rename" id="rename-input" data-rename="' + esc(m.id) + '" maxlength="120" aria-label="Meeting name"></div>';
    var pen = canWrite ? '<button class="pen" data-pen="' + esc(m.id) + '" title="Rename" aria-label="Rename meeting">' + PEN + "</button>" : "";
    var name = tag ? "<" + tag + (tag === "span" ? ' class="rt"' : "") + ">" + esc(titleOf(m)) + "</" + tag + ">" : "";
    return '<div class="tline">' + name + pen + "</div>";
  }
  function detailHtml(m) {
    var h = headInfo(m), p = parts(m);
    return '<div class="dhead"><h2>' + esc(titleOf(m)) + '</h2><div class="meta">' + h.when + "</div>" + (h.chips ? '<div class="chips">' + h.chips + "</div>" : "") + "</div>" +
      '<div class="dgrid"><div class="col">' + (p.summary ? '<div class="dc">' + p.summary + "</div>" : "") + (p.decisions ? '<div class="dc">' + p.decisions + "</div>" : "") + "</div>" +
      '<div class="col">' + (p.todos ? '<div class="dc">' + p.todos + "</div>" : "") + (p.waits ? '<div class="dc">' + p.waits + "</div>" : "") + "</div>" +
      (p.deliv ? '<div class="dc full">' + p.deliv + "</div>" : "") +
      '<div class="dc full"><div class="row3">' + p.links + p.people + "</div>" + p.btns + "</div></div>";
  }

  /* ---------- render ---------- */
  function render() {
    renderPage();
    // Re-rendering replaces the rename field, so put the typed text and the cursor back.
    var inp = editing && document.getElementById("rename-input");
    if (inp && document.activeElement !== inp) { inp.value = editDraft; inp.focus(); inp.setSelectionRange(editDraft.length, editDraft.length); }
  }
  function renderPage() {
    $("today-label").textContent = dayLabel(new Date()) + ", " + new Date().getDate() + " " + MONTHS[new Date().getMonth()];
    var items = allItems(), open = items.filter(function (i) { return !i.done; });
    var todos = open.filter(function (i) { return i.kind === "todo"; }), waits = open.filter(function (i) { return i.kind === "wait"; });
    var overdue = todos.filter(function (i) { return bucket(i.due) === "over"; }), dueToday = todos.filter(function (i) { return bucket(i.due) === "today"; });
    var doneItems = items.filter(function (i) { return i.done; });

    $("counters").innerHTML = [["Due today", dueToday.length, false, "todos"], ["Overdue", overdue.length, overdue.length > 0, "todos"], ["Open to-dos", todos.length, false, "todos"], ["Waiting on others", waits.length, false, "waiting"]]
      .map(function (c) { return '<button class="counter' + (c[2] ? " hot" : "") + '" data-tab="' + c[3] + '"><b>' + c[1] + "</b><span>" + c[0] + "</span></button>"; }).join("");

    var focus = overdue.concat(dueToday);
    $("today").innerHTML = '<h2 id="today-h">Today</h2>' + (focus.length ?
      '<ul class="items">' + focus.map(function (i) { return itemHtml(i, false); }).join("") + "</ul>" :
      '<p class="none">' + (meetings.size ? "Nothing is due today. You are on top of it." : "Your to-dos from meetings will show up here.") + "</p>");

    $("tabs").innerHTML = [["meetings", "Meetings", meetings.size], ["todos", "My to-dos", todos.length], ["waiting", "Waiting on others", waits.length], ["done", "Done", doneItems.length]]
      .map(function (t) { return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + "<small>" + t[2] + "</small></button>"; }).join("");

    $("note").hidden = !ticksLocal;
    var v = $("view"), dt = $("detail"), wide = mq.matches;
    function put(main, side) { if (wide) { v.innerHTML = side || ""; dt.innerHTML = main; } else { v.innerHTML = main; dt.innerHTML = ""; } }
    if (!loaded) { put('<div class="empty">Loading your meetings...</div>'); return; }
    if (!meetings.size) { put('<div class="empty"><b>No meetings yet</b>Click Start in the widget when your next call begins.</div>'); return; }

    var ok = function (i) { return matches(i.m); };
    if (tab === "meetings") {
      var list = sortedMeetings().filter(matches);
      if (!list.length) { put('<div class="empty">No meetings match your search.</div>'); return; }
      if (!wide) { put(list.map(cardHtml).join("")); return; }
      var cur = list.filter(function (m) { return m.id === selected; })[0] || list[0];
      put(detailHtml(cur), list.map(function (m) { return rowHtml(m, m.id === cur.id); }).join(""));
    } else if (tab === "todos") {
      var groups = [["over", "Overdue"], ["today", "Today"], ["week", "This week"], ["later", "Later"], ["none", "No date"]], html = "";
      var mine = todos.filter(ok).sort(function (a, b) { return String(a.due || "9").localeCompare(String(b.due || "9")); });
      groups.forEach(function (g) {
        var rows = mine.filter(function (i) { return bucket(i.due) === g[0]; });
        if (rows.length) html += '<div class="group"><h3 class="' + (g[0] === "over" ? "over" : "") + '">' + g[1] + '</h3><div class="panel"><ul class="items">' + rows.map(function (i) { return itemHtml(i, false); }).join("") + "</ul></div></div>";
      });
      put(html || '<div class="empty"><b>No open to-dos</b>Nice work.</div>');
    } else if (tab === "waiting") {
      var w = waits.filter(ok).sort(function (a, b) { return String(a.due || "9").localeCompare(String(b.due || "9")); });
      put(w.length ? '<div class="panel"><ul class="items">' + w.map(function (i) { return itemHtml(i, true); }).join("") + "</ul></div>" : '<div class="empty"><b>Nobody owes you anything</b>Promises from others will appear here.</div>');
    } else {
      var d = doneItems.filter(ok);
      put(d.length ? '<div class="panel"><ul class="items">' + d.map(function (i) { return itemHtml(i, i.kind === "wait"); }).join("") + "</ul></div>" : '<div class="empty"><b>Nothing ticked off yet</b>Finished items will collect here.</div>');
    }
  }

  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3500); }

  /* ---------- actions ---------- */
  function saveLocalTicks() {
    try { var o = {}; ticks.forEach(function (v, k) { o[k] = v; }); localStorage.setItem("mm-ticks", JSON.stringify(o)); } catch (e) {}
  }
  function tick(id, key, value) {
    var prev = ticks.get(id) || {}, next = Object.assign({}, prev); next[key] = value;
    ticks.set(id, next); render();                                   // instant
    if (!db) { saveLocalTicks(); return; }
    var p = (writeChain.get(id) || Promise.resolve()).then(function () { return db.doc("ticks/" + id).set(next); })
      .catch(function () { ticks.set(id, prev); render(); toast("Could not save that. Try again in a moment."); });
    writeChain.set(id, p);
  }

  function saveLocalTitles() {
    try { var o = {}; titles.forEach(function (v, k) { o[k] = v; }); localStorage.setItem("mm-titles", JSON.stringify(o)); } catch (e) {}
  }
  function startRename(id) {
    var m = meetings.get(id); if (!m || !canWrite) return;
    editing = id; editDraft = titleOf(m); render();
    var inp = document.getElementById("rename-input"); if (inp) inp.select();
  }
  /* An empty name, or the AI's own name, removes the override. */
  function finishRename(save) {
    var id = editing; editing = null;
    var m = meetings.get(id); if (!m) { render(); return; }
    var name = editDraft.trim().slice(0, 120), prev = titles.get(id);
    if (!save || name === titleOf(m)) { render(); return; }
    var custom = name && name !== m.title ? name : null;
    if (custom) titles.set(id, custom); else titles.delete(id);
    render();                                                        // instant
    if (!db) { saveLocalTitles(); return; }
    var key = "t:" + id, ref = db.doc("titles/" + id);
    var p = (writeChain.get(key) || Promise.resolve()).then(function () { return custom ? ref.set({ title: custom }) : ref.delete(); })
      .catch(function () { if (prev) titles.set(id, prev); else titles.delete(id); render(); toast("Could not save that. Try again in a moment."); });
    writeChain.set(key, p);
  }

  function loadTranscript(id) {
    if (trText.has(id) || trBusy.has(id)) return Promise.resolve();
    trBusy.add(id); render();
    return fetch("data/transcripts/" + encodeURIComponent(id) + ".md?t=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(r.status); return r.text();
    }).then(function (t) { trText.set(id, t); }, function () { trText.set(id, null); })
      .then(function () { trBusy.delete(id); render(); });
  }

  function download(id) {
    var m = meetings.get(id); if (!m || !downloads) return;
    loadTranscript(id).then(function () {
      var text = trText.get(id);
      if (!text) { toast("The transcript is not available for this meeting."); return; }
      var name = (id + " " + titleOf(m)).replace(/[\\/:*?"<>|]+/g, "-").trim() + ".md";
      downloads.save({ filename: name, data: text }).then(function () { toast("Transcript saved."); })
        .catch(function (e) { if (e && e.code !== "declined") toast("Could not save the transcript."); });
    });
  }

  document.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-rename]")) return;
    var pen = ev.target.closest("[data-pen]"); if (pen) { startRename(pen.dataset.pen); return; }
    var el = ev.target.closest("[data-tab],[data-select],[data-toggle],[data-tr],[data-dl],[data-goto]"); if (!el) return;
    if (el.dataset.tab) { tab = el.dataset.tab; render(); }
    else if (el.dataset.select) { selected = el.dataset.select; render(); }
    else if (el.dataset.toggle) { var id = el.dataset.toggle; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
    else if (el.dataset.tr) {
      var t = el.dataset.tr; if (trShown.has(t)) { trShown.delete(t); render(); } else { trShown.add(t); render(); loadTranscript(t); }
    }
    else if (el.dataset.dl) download(el.dataset.dl);
    else if (el.dataset.goto) {
      var g = el.dataset.goto; selected = g; tab = "meetings"; query = ""; $("search").value = ""; expanded.add(g); render();
      var c = document.getElementById("m-" + g); if (c) c.scrollIntoView({ block: "start" });
    }
  });
  document.addEventListener("change", function (ev) {
    var cb = ev.target.closest("[data-tick]"); if (!cb) return;
    var p = cb.dataset.tick.split("|"); tick(p[0], p[1], cb.checked);
  });
  $("search").addEventListener("input", function (e) { query = e.target.value.trim(); render(); });
  document.addEventListener("input", function (ev) { if (ev.target.dataset && ev.target.dataset.rename) editDraft = ev.target.value; });
  document.addEventListener("keydown", function (ev) {
    var r = ev.target.classList && ev.target.classList.contains("row") && ev.target.dataset.select;
    if (r && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); selected = r; render(); return; }
    if (!ev.target.dataset || !ev.target.dataset.rename) return;
    if (ev.key === "Enter") { ev.preventDefault(); finishRename(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finishRename(false); }
  });
  // Clicking away saves. A field that a re-render removed is not "clicked away" from.
  document.addEventListener("focusout", function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.rename && editing === t.dataset.rename) setTimeout(function () { if (t.isConnected && editing) finishRename(true); }, 0);
  });

  /* ---------- boot ---------- */
  var stamps = new Map(), refreshing = false;
  function getJson(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function refresh() {
    if (refreshing) return; refreshing = true;
    getJson("data/index.json?t=" + Date.now()).then(function (idx) {
      var list = (idx && idx.meetings) || [], ids = new Set();
      return Promise.all(list.map(function (e) {
        ids.add(e.id);
        var stamp = String(e.generated_at || e.started_at || "");
        if (meetings.has(e.id) && stamps.get(e.id) === stamp) return null;
        return getJson("data/meetings/" + encodeURIComponent(e.id) + ".json?v=" + encodeURIComponent(stamp)).then(function (m) {
          m.id = e.id; stamps.set(e.id, stamp); meetings.set(e.id, m); trText.delete(e.id);
        }, function () {});
      })).then(function () {
        Array.from(meetings.keys()).forEach(function (k) { if (!ids.has(k)) meetings.delete(k); });
      });
    }).catch(function () { /* missing or broken index: show the empty state */ })
      .then(function () { refreshing = false; loaded = true; render(); });
  }
  render();
  refresh();
  setInterval(function () { if (document.visibilityState === "visible") refresh(); }, 60000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh(); });

  (window.claude ? window.claude.use("downloads") : Promise.resolve(null)).then(function (d) { downloads = d; render(); }, function () {});
  (window.claude ? window.claude.use("user") : Promise.resolve(null)).then(function (u) {
    if (u && u.can && u.can("data.write") === false) { canWrite = false; render(); }
  }, function () {});
  (window.claude ? window.claude.use("db") : Promise.resolve(null)).then(function (d) {
    if (!d) throw new Error("no db");
    db = d;
    db.collection("ticks").onSnapshot(function (snap) {
      snap.docs.forEach(function (doc) { ticks.set(doc.id, doc.data() || {}); });
      render();
    }, function () { db = null; useLocalTicks(); });
    db.collection("titles").onSnapshot(function (snap) {
      titles = new Map();
      snap.docs.forEach(function (doc) { var t = (doc.data() || {}).title; if (t) titles.set(doc.id, String(t)); });
      render();
    }, function () {});
  }).catch(function () { db = null; useLocalTicks(); });
  function useLocalTicks() {
    ticksLocal = true;
    try { var o = JSON.parse(localStorage.getItem("mm-ticks") || "{}"); Object.keys(o).forEach(function (k) { ticks.set(k, o[k]); }); } catch (e) {}
    try { var t = JSON.parse(localStorage.getItem("mm-titles") || "{}"); Object.keys(t).forEach(function (k) { titles.set(k, String(t[k])); }); } catch (e) {}
    render();
  }
})();
</script>
<script>
/* ctcHealth DotField, trimmed to the corner pose: calm rest picture, dots swell softly near the pointer. */
(function () {
  var btn = document.getElementById("theme"), root = document.documentElement;
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
  function paint() { var light = root.getAttribute("data-theme") === "light"; btn.innerHTML = light ? MOON : SUN; btn.setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme"); }
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next); paint();
    try { localStorage.setItem("mm-theme", next); } catch (e) {}
  });
  paint();
})();
(function () {
  var box = document.getElementById("dots"); if (!box) return;
  var cv = box.firstElementChild, ctx = cv.getContext("2d");
  var P = 12, SEED = 7, SHARE = .15, W = 0, H = 0, F = null, cur = null, ptr = null, raf = 0;
